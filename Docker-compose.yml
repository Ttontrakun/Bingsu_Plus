# รันทั้งสแตกด้วยคำสั่งเดียว: docker compose up -d --build
# จากโฟลเดอร์ bingsu_plus:  cd bingsu_plus && docker compose up -d --build
#
# ต้องมีไฟล์ env: copy askaa_backend/env.sample เป็น askaa_backend/.env
# แล้วใส่ OPENAI_API_KEY / GEMINI_API_KEY ตามที่ใช้

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ask_the_manual
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ask_the_manual"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6334:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  legacy:
    build:
      context: ./askaa_backend
      dockerfile: Dockerfile.legacy
    restart: unless-stopped
    env_file:
      - ./askaa_backend/.env
    environment:
      - PORT=5052
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ask_the_manual?schema=public
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - UPLOAD_QUEUE_MODE=redis
      - OCR_API_URL=http://api:8000
      - STORE_RAW_FILES=false
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    command: sh -c "npx prisma migrate deploy && node server/index.js"

  worker:
    build:
      context: ./askaa_backend
      dockerfile: Dockerfile.legacy
    restart: unless-stopped
    env_file:
      - ./askaa_backend/.env
    environment:
      - WORKER_MODE=upload
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ask_the_manual?schema=public
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - UPLOAD_QUEUE_MODE=redis
      - OCR_API_URL=http://api:8000
      - STORE_RAW_FILES=false
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    command: sh -c "npx prisma migrate deploy && node server/worker.js"

  api:
    build:
      context: ./askaa_backend
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./askaa_backend/.env
    environment:
      - PORT=8000
      - LEGACY_API_URL=http://legacy:5052
    depends_on:
      - legacy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: askaa_backend/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
