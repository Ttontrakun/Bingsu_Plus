services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ask_the_manual
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ask_the_manual"]
      interval: 5s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6334:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # React (Vite) dev server in Docker
  frontend:
    image: node:20-alpine
    profiles: ["app"]
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 3000"

  # FastAPI backend in Docker
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["app"]
    environment:
      - PORT=8000
      - LEGACY_API_URL=http://legacy:5050
      - OCR_LANG=th
      - OCR_MAX_PAGES=30
      - OCR_DPI=200
      - OCR_USE_ANGLE_CLS=true
    ports:
      - "8000:8000"
    volumes:
      - paddle_cache:/root/.cache/paddle
      - paddleocr_models:/root/.paddleocr

  # Legacy Node/Express API (temporary during migration to FastAPI)
  legacy:
    image: node:20-alpine
    profiles: ["app"]
    working_dir: /app
    environment:
      - LISTEN_HOST=0.0.0.0
      - PORT=5050
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ask_the_manual?schema=public
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - UPLOAD_QUEUE_MODE=redis
      - OCR_API_URL=http://api:8000
      - OCR_ENABLED=true
      - OCR_LANG=th
      - OCR_MAX_PAGES=30
      - OCR_DPI=200
      - OCR_USE_ANGLE_CLS=true
      - OCR_MIN_TEXT_CHARS=200
    depends_on:
      - postgres
      - qdrant
      - redis
    ports:
      - "5050:5050"
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -lc "npm install && npm run prisma:generate && npx prisma migrate deploy && node server/index.js"

  # Legacy upload worker (required when UPLOAD_QUEUE_MODE=redis)
  worker:
    image: node:20-alpine
    profiles: ["app"]
    working_dir: /app
    environment:
      - LISTEN_HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ask_the_manual?schema=public
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - UPLOAD_QUEUE_MODE=redis
      - WORKER_MODE=upload
      - OCR_API_URL=http://api:8000
      - OCR_ENABLED=true
      - OCR_LANG=th
      - OCR_MAX_PAGES=30
      - OCR_DPI=200
      - OCR_USE_ANGLE_CLS=true
      - OCR_MIN_TEXT_CHARS=200
    depends_on:
      - postgres
      - qdrant
      - redis
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -lc "npm install && npm run prisma:generate && npx prisma migrate deploy && node server/worker.js"

  # Nginx reverse proxy (single entrypoint)
  nginx:
    image: nginx:alpine
    profiles: ["app"]
    depends_on:
      - frontend
      - api
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  paddle_cache:
  paddleocr_models: