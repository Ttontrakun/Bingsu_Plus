# Full Stack Docker Compose for ALL_BACKEND
# Includes all services: Node/Express, FastAPI OCR, Infrastructure

services:
  # Infrastructure
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ask_the_manual
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ask_the_manual"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6334:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # Node/Express API (Main Backend)
  api:
    build:
      context: ..
      dockerfile: ALL_BACKEND/Dockerfile
    restart: unless-stopped
    env_file:
      - ../config/env/.env
    environment:
      - PORT=5052
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ask_the_manual?schema=public
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - UPLOAD_QUEUE_MODE=redis
      - OCR_API_URL=http://ocr:8000
      - OCR_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "5052:5052"
    volumes:
      - ../uploads:/app/uploads
      - ../.uploads:/app/.uploads

  # OCR Service (FastAPI)
  ocr:
    build:
      context: ..
      dockerfile: ALL_BACKEND/services/ocr/Dockerfile
    restart: unless-stopped
    env_file:
      - ../config/env/.env
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - api

  # Upload Worker
  worker:
    build:
      context: ..
      dockerfile: ALL_BACKEND/Dockerfile
    restart: unless-stopped
    env_file:
      - ../config/env/.env
    environment:
      - WORKER_MODE=upload
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ask_the_manual?schema=public
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - UPLOAD_QUEUE_MODE=redis
      - OCR_API_URL=http://ocr:8000
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    command: ["node", "-e", "process.env.WORKER_MODE='upload'; require('./main.js')"]

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
